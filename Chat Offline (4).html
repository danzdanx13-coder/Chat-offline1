<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Offline</title>
<style>
:root{--bg:#f0f2f5;--panel:#fff;--text:#111b21;--sub:#667781;--green:#008069;--out:#d9fdd3;--in:#fff;--chat:#efeae2;--line:#e9edef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--panel:#111b21;--text:#e9edef;--sub:#8696a0;--green:#00a884;--out:#005c4b;--in:#202c33;--chat:#0b141a;--line:#222d34}}
:root[data-theme="dark"]{--bg:#0b141a;--panel:#111b21;--text:#e9edef;--sub:#8696a0;--green:#00a884;--out:#005c4b;--in:#202c33;--chat:#0b141a;--line:#222d34}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

svg{display:block}
.app{height:100%;max-width:520px;margin:0 auto;background:var(--panel);position:relative;overflow:hidden}

.list{flex:1;overflow-y:auto}

.tt{flex:1;min-width:0;cursor:pointer}

.b{max-width:82%;padding:6px 9px 4px;border-radius:9px;background:var(--in);word-wrap:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.b.me{align-self:flex-end;background:var(--out)}

.sn{font-size:12px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:3px}
.day{align-self:center;background:var(--in);color:var(--sub);font-size:12px;padding:3px 10px;border-radius:8px;margin:6px 0;display:flex;gap:6px;align-items:center}
.bar,#rec{display:flex;gap:8px;padding:8px;align-items:center}
.bar input{flex:1;padding:11px 16px;border-radius:24px;border:0;background:var(--panel)}
.send{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
#rec{display:none}

.modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.on{display:flex}
.card{background:var(--panel);border-radius:14px;padding:18px;width:100%;max-height:88%;overflow-y:auto}
.card h2{font-size:17px;margin-bottom:8px}
.card input[type=text],.card input[type=tel]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 3px}
.acts{display:flex;justify-content:flex-end;gap:18px;margin-top:14px;color:var(--green);font-weight:600}
.lnk{color:var(--green);font-weight:600;padding:8px 0;display:block}
.pc{display:flex;justify-content:center;margin:6px 0}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 0;width:100%;text-align:left}
.mrow .name{flex:1}
.call{position:absolute;inset:0;background:#0b141a;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 20px 40px;z-index:9}
.call.on{display:flex}
#lv{position:absolute;right:14px;top:14px;width:96px;height:132px;object-fit:cover;border-radius:10px;background:#222;display:none;transform:scaleX(-1)}
.ci{text-align:center}.ci h2{margin:14px 0 4px}.ci p{color:#aebac1;font-size:14px}
.cb{display:flex;gap:22px}
.rb{width:58px;height:58px;border-radius:50%;background:#2a3942;color:#fff;display:grid;place-items:center}
.rb.off{background:#fff;color:#111}
.red{background:#e53935}.red svg{transform:rotate(135deg)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:85%;text-align:center}
#toast.on{opacity:1}
#toast{z-index:50}
button,#ob,.top,.tabs,.item,.fab,.pr,.mrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,#ob input,.b{-webkit-user-select:text;user-select:text}
.call .av{margin:0 auto}.ci{display:flex;flex-direction:column;align-items:center}.rb[data-a=ansc] svg{transform:none}.bar input:disabled{opacity:.6}.item .tag{font-size:11px;color:#e67e22;margin-left:6px;font-weight:400}
.irow.dng{color:#e53935;font-weight:600;border-top:1px solid var(--line)}.ci h2{display:flex;align-items:center;justify-content:center;gap:6px}
.selb{position:absolute;top:0;left:0;right:0;display:none;z-index:2}.selb.on{display:flex}.selb h1{flex:none!important;margin-right:auto}
.msgs .b{-webkit-user-select:none;user-select:none}.b.sel{outline:2px solid var(--green);filter:brightness(.9)}
#nv{transform:translateX(100%);z-index:6}.n #nv{transform:none}
.nvh{background:var(--panel);color:var(--text)}.nvh .ico{color:var(--text)}.nvh h1{font-weight:400}
.fld{display:flex;gap:16px;align-items:center;margin:16px 16px 0}.fld>svg{color:var(--sub);flex:none}.fld input,.fld select{flex:1;min-width:0;padding:16px 14px;border:1.5px solid var(--sub);border-radius:10px;background:none;color:var(--text);font:inherit}.fld select{flex:none;width:130px}.fld select option{color:#111}
.sl{position:relative}.sl label{position:absolute;top:-9px;left:10px;background:var(--panel);padding:0 4px;margin:0;font-size:12px}
.nvs{margin:auto 16px calc(16px + env(safe-area-inset-bottom,0px));padding:16px;border-radius:28px;background:var(--green);color:#fff;font-weight:600;font-size:16px}.nvs.dim{background:var(--line);color:var(--sub)}
.kr .gi{width:48px;height:48px}.kr b{font-size:17px}
#nw{position:fixed;inset:0;z-index:40;background:var(--bg);color:var(--text);overflow-y:auto;display:none}#nw.on{display:block}
.nwc{max-width:720px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.nwh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.nwh h1{font-size:22px;line-height:1.2}.nwh small{font-size:14px;color:var(--sub);font-weight:400}
.nwb{background:var(--green);color:#fff;border-radius:20px;padding:9px 14px;font-weight:600;font-size:14px}
.nwk{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}.nwk h2{font-size:17px;margin-bottom:6px}
.nwk input,.nwk select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.nrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.nrow>div,.nrow>b{flex:1;min-width:140px}.nrow button{color:var(--green);font-weight:600}
.otp{font-size:24px;font-weight:700;letter-spacing:4px;color:var(--green)}.otp.dim{color:var(--sub);text-decoration:line-through}
.obx2{color:#21c063;font-weight:600;padding:8px;text-align:center}
.obb.dim{background:#202c33;color:#5b6a73}
.card select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
#ob{position:absolute;inset:0;z-index:19;background:#0b141a;color:#e9edef;display:none;flex-direction:column;padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px))}#ob.on{display:flex}
#ob h1{font-size:28px;font-weight:400;text-align:center}
.obm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.obp{color:#8696a0;font-size:15px;line-height:1.5}.obp b{color:#21c063;font-weight:600}
.obb{background:#21c063;color:#0b141a;font-weight:600;border-radius:28px;padding:16px;width:100%;font-size:16px}.obb:disabled{background:#202c33;color:#5b6a73}
.obl{width:100%;max-width:300px;border-bottom:2px solid #21c063;padding:8px 0;display:flex;align-items:center;gap:8px;color:#e9edef}
.obl select,.obl input{background:none;border:0;outline:0;color:#e9edef;font-size:18px;width:100%;font-family:inherit}.obl select option{color:#111}
.obr{display:flex;gap:20px;width:100%;max-width:300px}
.obx{position:absolute;top:18px;right:20px;color:#8696a0}
#iv,#sg{transform:translateX(100%);z-index:3}#sg{z-index:4}.i #iv,.g #sg{transform:none}
.iav{display:flex;justify-content:center;margin:24px 0 10px}
.ih{text-align:center;padding:0 16px}.in{font-size:22px;font-weight:600;display:flex;justify-content:center;align-items:center;gap:6px}.is{color:var(--sub);margin-top:2px}
.ia{display:flex;justify-content:center;gap:12px;padding:16px}.ia button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--green);border:1px solid var(--line);border-radius:12px;padding:12px 0;width:104px;font-size:13px}
.isec{border-top:8px solid var(--bg);padding:12px 16px}
.irow{display:flex;justify-content:space-between;width:100%;padding:14px 16px;text-align:left}.irow.red{color:#e53935;font-weight:600;border-top:8px solid var(--bg)}
.ith{display:flex;gap:6px;margin-top:10px}.ith img{width:72px;height:72px;object-fit:cover;border-radius:6px;cursor:pointer}
#pv{transform:translateX(100%);z-index:3}.p #pv{transform:none}
.pav{position:relative;width:150px;height:150px;margin:28px auto 18px}
.pcam{position:absolute;right:0;bottom:0;width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:3px solid var(--panel)}
.pr{display:flex;gap:18px;padding:12px 20px 0;width:100%;text-align:left;align-items:flex-start}
.pr>svg{color:var(--sub);margin-top:2px;flex:none}
.pr .pm{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:12px}
.pr small{display:block;color:var(--sub);font-size:13px}
.pr .pv2{font-size:16px;display:flex;align-items:center;gap:5px;word-break:break-word}
.pr .ed{color:var(--green);margin-top:8px}
.pn{color:var(--sub);font-size:13px;padding:8px 20px 4px 62px}
.tabs{display:flex;background:var(--green)}.tabs button{flex:1;padding:10px;color:#fff;opacity:.7;font-weight:600;border-bottom:3px solid transparent}.tabs button.on{opacity:1;border-color:#fff}
.last{display:flex;align-items:center;gap:4px}.last span{min-width:0;overflow:hidden;text-overflow:ellipsis}
#kv{transform:translateX(100%);z-index:3}.k #kv{transform:none}
.kr{padding:10px 14px}.gi{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.lt{padding:8px 14px;color:var(--green);font-weight:600;font-size:13px}
.pic{display:block;max-width:100%;max-height:260px;border-radius:7px;margin-bottom:3px;cursor:pointer}
.pv{max-width:100%;max-height:45vh;border-radius:8px}
.ring{padding:2px;border-radius:50%;border:2.5px solid var(--green)}
.stp{border-radius:12px;padding:14px;margin:8px 0}.stp textarea{width:100%;min-height:110px;background:none;border:0;outline:0;color:#fff;font-weight:600;font-size:20px;font-family:inherit;text-align:center;resize:none}
.sw{display:flex;gap:10px}.sw button{width:30px;height:30px;border-radius:50%}
#vw{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;color:#fff}#vw.on{display:flex}#vw>img{max-width:100%;max-height:100%}
.pg{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px}.pg i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}.pg i.d{background:#fff}.pg i.a::after{content:"";display:block;height:100%;background:#fff;animation:fl 5s linear forwards}@keyframes fl{from{width:0}to{width:100%}}
.vh{position:absolute;top:24px;left:12px;display:flex;gap:10px;align-items:center}
.vt{font-weight:600;font-size:24px;line-height:1.3;text-align:center;padding:30px;white-space:pre-wrap}
.vc{position:absolute;bottom:30px;left:0;right:0;text-align:center;padding:0 20px;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="view" id="home">
    <div class="top"><h1>Chat Offline</h1>
      <button class="ico" data-a="newg" data-i="grp" aria-label="Grup baru"></button>
      <button class="ico" data-a="kon" data-i="con" aria-label="Daftar nomor"></button>
      <button class="ico" data-a="prof" data-i="usr" aria-label="Profil"></button></div>
    <div class="tabs"><button data-a="tab" data-t="c" class="on">Chat</button><button data-a="tab" data-t="s">Status</button></div><div class="search"><input id="q" placeholder="Cari nama atau nomor…" autocomplete="off"></div>
    <div class="list" id="list"></div><div class="list" id="stl" style="display:none"></div>
    <div class="note">Semua pesan tersimpan di perangkat ini, tanpa internet.</div>
    <button class="fab" id="fab" data-a="addc" data-i="plus" aria-label="Daftarkan kontak"></button>
  </section>
  <section class="view" id="chat">
    <div class="top"><button class="ico" data-a="back" data-i="back" aria-label="Kembali"></button><div id="cav" data-a="info"></div><div class="tt" data-a="info"><h1 id="cname"></h1><div id="csub" class="time"></div></div><button class="ico" data-a="vcall" data-i="vid" aria-label="Video call"></button><button class="ico" data-a="call" data-i="ph" aria-label="Telepon"></button></div>
    <div class="msgs" id="msgs"></div>
    <div class="bar" id="bar"><button class="ico" data-a="att" data-i="img" style="color:var(--sub)" aria-label="Kirim foto"></button><input type="file" id="fp" accept="image/*" hidden><input id="txt" placeholder="Ketik pesan" autocomplete="off"><button class="send" id="sv" data-a="sv" aria-label="Kirim"></button></div>
    <div id="rec"><button class="ico" data-a="rc" style="color:var(--sub)" data-i="del" aria-label="Batal"></button><b id="rt">0:00</b><button class="send" data-a="rs" data-i="send" aria-label="Kirim suara"></button></div>
  </section>
  <section class="view" id="nv"><div class="top nvh"><button class="ico" data-a="nb" data-i="back" aria-label="Kembali"></button><h1>Kontak baru</h1></div><div id="nvb" style="flex:1;overflow-y:auto"></div><button class="nvs dim" id="nsv" data-a="nsave">Simpan</button></section>
  <section class="view" id="iv"><div class="top"><button class="ico" data-a="ib" data-i="back" aria-label="Kembali"></button><h1 id="ivt"></h1></div><div class="list" id="ivb"></div></section>
  <section class="view" id="sg"><div class="top"><button class="ico" data-a="sb" data-i="back" aria-label="Kembali"></button><h1>Pengaturan</h1></div><div class="list" id="sl"></div></section>
  <section class="view" id="pv"><div class="top"><button class="ico" data-a="pb" data-i="back" aria-label="Kembali"></button><h1>Profil</h1></div><div class="list" id="pl"></div><input type="file" id="ft" accept="image/*" hidden></section>
  <section class="view" id="kv"><div class="top"><button class="ico" data-a="kb" data-i="back" aria-label="Kembali"></button><div class="tt" style="cursor:default"><h1>Pilih kontak</h1><div class="time" id="kc"></div></div><button class="ico" data-a="ksr" data-i="srch" aria-label="Cari"></button></div><div class="search" id="ksb" style="display:none"><input id="kq" placeholder="Cari nama atau nomor…" autocomplete="off"></div><div class="list" id="kl"></div></section>
  <div class="modal" id="m"><div class="card" id="mc"></div></div>
  <div class="call" id="call"></div>
  <div id="ob"></div><div id="nw"></div><div id="toast"></div><div id="vw"></div><input type="file" id="fs" accept="image/*" hidden>
</div>
<script>
(function(){
